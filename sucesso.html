<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Pedido | NOVA.</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#111827;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:26px;padding:38px;box-shadow:0 20px 70px #11182712}.logo{font-size:25px;font-weight:900;margin-bottom:34px}.logo b{color:#6d28d9}.icon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:#ede9fe;font-size:30px;margin-bottom:22px}h1{font-size:34px;letter-spacing:-1.4px;margin:0 0 12px}p{color:#6b7280;line-height:1.6;margin:0 0 24px}.status{background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;padding:14px 16px;font-size:13px;margin-bottom:22px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 17px;border-radius:11px;font-weight:850;text-decoration:none}.primary{background:#111827;color:#fff}.secondary{background:#f3f4f6;color:#111827}@media(max-width:600px){.card{padding:28px 22px}h1{font-size:29px}}</style></head><body><main class="card"><div class="logo">NOVA<b>.</b></div><div class="icon" id="icon">⏳</div><h1 id="title">Confirmando seu pedido</h1><p id="message">Estamos validando o pagamento. Isso normalmente leva apenas alguns instantes.</p><div class="status" id="status">Aguardando confirmação…</div><div class="actions"><a class="btn primary" href="index.html#produtos">Voltar para a loja</a><a class="btn secondary" href="carrinho.html">Ver carrinho</a></div></main><script>const CART='nova_store_cart_v4',STATUS_URL='https://ehwjhpodmbpcrvbkfjex.supabase.co/functions/v1/checkout-status';const sessionId=new URLSearchParams(location.search).get('session_id');const title=document.querySelector('#title'),message=document.querySelector('#message'),statusBox=document.querySelector('#status'),icon=document.querySelector('#icon');function paid(data){localStorage.removeItem(CART);icon.textContent='✓';title.textContent='Pedido confirmado';message.textContent='Seu pagamento foi confirmado e o pedido foi registrado com sucesso.';statusBox.textContent='Pedido '+String(data.id||'').slice(0,8).toUpperCase()+' • '+Number(data.total||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function pending(){icon.textContent='⏳';title.textContent='Pagamento em processamento';message.textContent='Recebemos seu retorno do pagamento e estamos aguardando a confirmação final.';statusBox.textContent='Você pode fechar esta página com segurança. O pedido será atualizado automaticamente.'}function failed(){icon.textContent='!';title.textContent='Não foi possível confirmar';message.textContent='O pagamento não foi confirmado. Seu carrinho continua salvo para você tentar novamente.';statusBox.textContent='Volte ao carrinho para continuar.'}async function check(attempt=0){if(!sessionId){failed();return}try{const r=await fetch(STATUS_URL+'?session_id='+encodeURIComponent(sessionId));const d=await r.json();if(d.status==='paid'){paid(d);return}if(d.status==='cancelled'||d.status==='refunded'){failed();return}if(attempt<5){statusBox.textContent='Validando pagamento…';setTimeout(()=>check(attempt+1),1600);return}pending()}catch{if(attempt<3)setTimeout(()=>check(attempt+1),1800);else pending()}}check();</script></body></html>
