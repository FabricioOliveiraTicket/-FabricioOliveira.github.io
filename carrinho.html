<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho | NOVA.</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7fb;color:#111827}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}header{background:#fff;border-bottom:1px solid #e5e7eb}.nav{max-width:1080px;margin:auto;height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:24px;font-weight:900}.logo b{color:#6d28d9}.back{font-weight:750;color:#4b5563}main{max-width:1080px;margin:40px auto;padding:0 20px}h1{font-size:38px;letter-spacing:-1.7px;margin:0 0 28px}.layout{display:grid;grid-template-columns:1fr 360px;gap:24px}.list,.summary{background:#fff;border:1px solid #e5e7eb;border-radius:20px}.list{overflow:hidden}.item{display:grid;grid-template-columns:90px 1fr auto;gap:15px;padding:18px;border-bottom:1px solid #eef0f4;align-items:center}.item:last-child{border-bottom:0}.item img{width:90px;height:90px;object-fit:cover;border-radius:13px;background:#eee}.item h3{font-size:15px;margin:0 0 7px}.price{font-weight:900}.controls{display:flex;align-items:center;gap:8px;margin-top:10px}.q{width:32px;height:32px;border:1px solid #d7dae2;background:white;border-radius:8px;font-weight:900}.remove{border:0;background:none;color:#b91c1c;font-size:12px}.line{font-weight:900;text-align:right}.summary{padding:22px;height:max-content;position:sticky;top:20px}.summary h2{margin:0 0 20px}.row{display:flex;justify-content:space-between;padding:10px 0;color:#4b5563}.total{border-top:1px solid #e5e7eb;margin-top:8px;padding-top:17px;font-size:20px;font-weight:900;color:#111827}.checkout{width:100%;border:0;background:#6d28d9;color:#fff;border-radius:12px;padding:14px;margin-top:18px;font-weight:900}.checkout:disabled{background:#b7aecb;cursor:not-allowed}.note{font-size:11px;line-height:1.5;color:#6b7280;margin-top:11px}.continue{display:block;text-align:center;margin-top:12px;font-weight:750;font-size:13px}.empty{padding:60px 20px;text-align:center;color:#6b7280}.empty a{display:inline-block;margin-top:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;font-weight:800}@media(max-width:760px){.layout{grid-template-columns:1fr}.summary{position:static}.item{grid-template-columns:72px 1fr}.item img{width:72px;height:72px}.line{grid-column:2;text-align:left}}</style></head><body><header><div class="nav"><a class="logo" href="index.html">NOVA<b>.</b></a><a class="back" href="index.html#produtos">← Continuar comprando</a></div></header><main><h1>Seu carrinho</h1><div class="layout"><section class="list" id="list"></section><aside class="summary"><h2>Resumo</h2><div class="row"><span>Itens</span><strong id="qty">0</strong></div><div class="row"><span>Subtotal</span><strong id="subtotal">R$ 0,00</strong></div><div class="row"><span>Frete</span><span>a definir</span></div><div class="row total"><span>Total</span><span id="total">R$ 0,00</span></div><button class="checkout" id="checkout">Finalizar compra</button><div class="note" id="checkoutNote">🔒 Pagamento seguro. O endereço de entrega será solicitado na próxima etapa.</div><a class="continue" href="index.html#produtos">Adicionar mais produtos</a></aside></div></main><script>
const CART='nova_store_cart_v4',list=document.querySelector('#list'),checkout=document.querySelector('#checkout');
const CHECKOUT_URL='https://ehwjhpodmbpcrvbkfjex.supabase.co/functions/v1/create-checkout';
const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function get(){try{return JSON.parse(localStorage.getItem(CART)||'[]')}catch{return[]}}
function save(c){localStorage.setItem(CART,JSON.stringify(c));render()}
function setCheckout(enabled){checkout.disabled=!enabled;checkout.textContent=enabled?'Finalizar compra':'Carrinho vazio'}
function render(){let c=get();if(!c.length){list.innerHTML='<div class="empty"><strong>Seu carrinho está vazio.</strong><br>Escolha alguns produtos para continuar.<br><a href="index.html#produtos">Ver produtos</a></div>';document.querySelector('#qty').textContent='0';document.querySelector('#subtotal').textContent=money(0);document.querySelector('#total').textContent=money(0);setCheckout(false);return}setCheckout(true);list.innerHTML=c.map((x,i)=>`<div class="item"><img src="${x.image}" alt=""><div><h3>${x.name}</h3><span class="price">${money(x.price)}</span><div class="controls"><button class="q" data-act="minus" data-i="${i}">−</button><strong>${x.qty}</strong><button class="q" data-act="plus" data-i="${i}">+</button><button class="remove" data-act="remove" data-i="${i}">remover</button></div></div><div class="line">${money(x.price*x.qty)}</div></div>`).join('');let q=c.reduce((a,x)=>a+x.qty,0),s=c.reduce((a,x)=>a+x.price*x.qty,0);document.querySelector('#qty').textContent=q;document.querySelector('#subtotal').textContent=money(s);document.querySelector('#total').textContent=money(s)}
list.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let c=get(),i=+b.dataset.i;if(b.dataset.act==='plus')c[i].qty++;if(b.dataset.act==='minus')c[i].qty=Math.max(1,c[i].qty-1);if(b.dataset.act==='remove')c.splice(i,1);save(c)});
checkout.addEventListener('click',async()=>{const c=get();if(!c.length)return;const previous=checkout.textContent;checkout.disabled=true;checkout.textContent='Abrindo pagamento…';document.querySelector('#checkoutNote').textContent='Conectando ao ambiente seguro de pagamento…';try{const res=await fetch(CHECKOUT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:c.map(x=>({id:x.id,quantity:x.qty}))})});const data=await res.json().catch(()=>({}));if(!res.ok||!data.url)throw new Error(data.error||'Não foi possível iniciar o pagamento.');window.location.href=data.url}catch(err){document.querySelector('#checkoutNote').textContent=err.message||'Não foi possível iniciar o pagamento.';checkout.disabled=false;checkout.textContent=previous}});
if(new URLSearchParams(location.search).get('cancelled'))document.querySelector('#checkoutNote').textContent='Pagamento cancelado. Seu carrinho continua salvo.';
render();
</script></body></html>
